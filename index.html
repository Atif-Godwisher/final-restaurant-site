<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karachi Grill House | Premium Immersive Dining</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --app-bg: #0A0B0D;
            --panel-bg: #121417;
            --card-bg: #16181D;
            --input-bg: #0E1013;
            --accent: #f59e0b;
        }
        
        body {
            background-color: var(--app-bg);
            color: #d1d5db;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--app-bg); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Is tareeke se error nahi aayega
        const motion = window.FramerMotion ? window.FramerMotion.motion : ({ children, className, ...props }) => <div className={className} {...props}>{children}</div>;
        const AnimatePresence = window.FramerMotion ? window.FramerMotion.AnimatePresence : ({ children }) => <>{children}</>;

        // --- Data ---
       const MENU_ITEMS = [
            { id: '1', name: 'Royal Seekh Kabab', price: 1200, category: 'BBQ', description: 'Tender minced mutton skewers grilled over charcoal.', image: 'https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?auto=format&fit=crop&q=80&w=600' },
            { id: '2', name: 'Chicken Tikka', price: 850, category: 'BBQ', description: 'Spicy marinated chicken quarter leg, slow roasted.', image: 'https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?auto=format&fit=crop&q=80&w=600' },
            { id: '3', name: 'Mutton Handi', price: 3200, category: 'Mains', description: 'Slow-cooked mutton in a rich cream gravy.', image: 'https://images.unsplash.com/photo-1545231027-63b6f2a75ad8?auto=format&fit=crop&q=80&w=600' },
            { id: '4', name: 'Beef Biryani', price: 1100, category: 'Rice', description: 'Aromatic long-grain rice with succulent beef.', image: 'https://images.unsplash.com/photo-1589302168068-964664d93dc0?auto=format&fit=crop&q=80&w=600' },
            { id: '5', name: 'Malai Boti', price: 1450, category: 'BBQ', description: 'Creamy boneless chicken chunks grilled to perfection.', image: 'https://images.unsplash.com/photo-1633945274405-b6c8069047b0?auto=format&fit=crop&q=80&w=600' },
            { id: '6', name: 'Garlic Naan', price: 150, category: 'Sides', description: 'Freshly baked tandoori naan with garlic butter.', image: 'https://images.unsplash.com/photo-1601050690597-df056fb1ce24?auto=format&fit=crop&q=80&w=600' }
        ];

        // --- Component: Icon Wrapper ---
        const Icon = ({ name, className }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        // --- Main App ---
        function App() {
            const [cart, setCart] = useState([]);
            const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
            const [activeCategory, setActiveCategory] = useState('All');
            const [formData, setFormData] = useState({ name: '', phone: '', address: '' });

            const addToCart = (item) => {
                setCart(prev => {
                    const exists = prev.find(i => i.id === item.id);
                    if (exists) return prev.map(i => i.id === item.id ? {...i, qty: i.qty + 1} : i);
                    return [...prev, {...item, qty: 1}];
                });
            };

            const updateQty = (id, delta) => {
                setCart(prev => prev.map(i => i.id === id ? {...i, qty: Math.max(0, i.qty + delta)} : i).filter(i => i.qty > 0));
            };

            const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            const total = subtotal + (subtotal > 0 ? 150 : 0);

            const handleOrder = (e) => {
                e.preventDefault();
                const items = cart.map(i => `- ${i.name} x${i.qty} (PKR ${i.price * i.qty})`).join('\n');
                const msg = `*NEW ORDER*\n\n*Name:* ${formData.name}\n*Phone:* ${formData.phone}\n*Address:* ${formData.address}\n\n*Items:*\n${items}\n\n*Total:* PKR ${total}\n*Payment:* COD\n\nPlease confirm!`;
                window.open(`https://wa.me/923001234567?text=${encodeURIComponent(msg)}`, '_blank');
                setCart([]);
                setIsCheckoutOpen(false);
            };

            return (
                <div className="flex bg-[#0A0B0D] text-zinc-300 min-h-screen">
                    {/* Navigation */}
                    <nav className="w-20 bg-[#121417] border-r border-zinc-800 flex flex-col items-center py-8 gap-10 shrink-0 h-screen sticky top-0 hidden md:flex">
                        <div className="w-12 h-12 bg-amber-500 rounded-full flex items-center justify-center text-black font-bold text-xl shadow-[0_0_20px_rgba(245,158,11,0.3)]">KG</div>
                        <div className="flex flex-col gap-8 opacity-60">
                            {['home', 'menu', 'about', 'map-pin'].map(icon => (
                                <div key={icon} className="flex flex-col items-center gap-1 group cursor-pointer hover:opacity-100">
                                    <div className="w-6 h-6 border-2 border-zinc-700 rounded-sm group-hover:border-amber-500 group-hover:bg-amber-500/20 transition-all"></div>
                                    <span className="text-[9px] uppercase font-bold tracking-tighter">{icon.split('-')[0]}</span>
                                </div>
                            ))}
                        </div>
                    </nav>

                    <main className="flex-1 p-6 md:p-10 max-w-5xl mx-auto space-y-10">
                        {/* Header */}
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                            <div className="space-y-1">
                                <h1 className="text-4xl md:text-5xl font-black text-white font-serif italic tracking-tighter">Karachi Grill House</h1>
                                <p className="text-amber-500/80 text-sm italic font-medium tracking-wide">Authentic Charcoal Flavors Since 1984</p>
                            </div>
                            <div className="flex gap-4 text-[10px] font-mono opacity-40 uppercase tracking-widest bg-zinc-900/50 px-4 py-2 rounded-full border border-zinc-800">
                                <span>Open Until 12:00 AM</span>
                                <span>•</span>
                                <span>Karachi, PK</span>
                            </div>
                        </header>

                        {/* Hero */}
                        <div className="relative h-64 rounded-[2.5rem] overflow-hidden bg-zinc-900 border border-zinc-800 shadow-2xl group">
                            <div className="absolute inset-0 bg-gradient-to-r from-black/90 via-black/40 to-transparent z-10"></div>
                            <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&q=80&w=1200')] bg-cover bg-center transition-transform duration-700 group-hover:scale-105 opacity-60"></div>
                            <div className="relative z-20 p-10 h-full flex flex-col justify-center max-w-md">
                                <span className="text-amber-500 text-[10px] font-black tracking-[0.4em] uppercase mb-3">Chef's Signature Selection</span>
                                <h2 className="text-3xl md:text-4xl font-serif italic text-white leading-[0.9] mb-4 font-black">Immortal <br /><span className="text-amber-500 not-italic">Smoke & Fire.</span></h2>
                                <button className="w-max px-8 py-2.5 bg-amber-500 text-black text-[10px] font-black uppercase tracking-widest rounded-full shadow-lg shadow-amber-500/20 active:scale-95 transition-all">Explore Menu</button>
                            </div>
                        </div>

                        {/* Menu */}
                        <div id="menu-section" className="space-y-6">
                            <div className="flex items-center justify-between border-b border-zinc-800/50 pb-4">
                                <h3 className="text-xs font-black uppercase tracking-[0.3em] text-zinc-500 flex items-center gap-3">
                                    <span className="w-12 h-[1px] bg-zinc-800"></span> Signature Specialties
                                </h3>
                                <div className="flex gap-2 overflow-x-auto scrollbar-hide">
                                    {['All', 'BBQ', 'Mains', 'Rice'].map(cat => (
                                        <button 
                                            key={cat}
                                            onClick={() => {
                                            setActiveCategory(cat);
                                                        // Agar aap chahte hain ke category change karte hi menu top par aa jaye:
                                        document.getElementById('menu-section')?.scrollIntoView({ behavior: 'smooth' });
                        }}
                                            className={`px-4 py-1.5 rounded-lg text-[9px] uppercase font-black tracking-[0.2em] transition-all ${activeCategory === cat ? 'bg-amber-500 text-black' : 'bg-zinc-900 text-zinc-500 border border-zinc-800 hover:border-amber-500/50'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {MENU_ITEMS.filter(item => activeCategory === 'All' || item.category === activeCategory).map(item => (
                                    <div key={item.id} className="bg-[#16181D] p-4 rounded-2xl border border-zinc-800/50 flex justify-between items-center group hover:border-amber-500/30 transition-all">
                                        <div className="flex gap-4">
                                            <div className="w-16 h-16 rounded-xl bg-zinc-800 shrink-0 overflow-hidden border border-zinc-700">
                                                <img src={item.image} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" />
                                            </div>
                                            <div className="flex flex-col justify-center">
                                                <h4 className="text-white text-sm font-black uppercase tracking-tight group-hover:text-amber-500 transition-colors">{item.name}</h4>
                                                <p className="text-[10px] text-zinc-500 italic max-w-[150px] line-clamp-1">{item.description}</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-4">
                                            <span className="text-amber-400 font-mono text-sm font-bold">PKR {item.price}</span>
                                            <button 
                                                onClick={() => addToCart(item)}
                                                className="w-10 h-10 bg-zinc-800 rounded-xl text-white flex items-center justify-center hover:bg-amber-500 hover:text-black transition-all active:scale-90"
                                            >
                                                <Icon name="plus" className="w-4 h-4" />
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Location */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pb-20">
                            <div className="h-44 bg-[#121417] rounded-3xl border border-zinc-800/50 overflow-hidden relative">
                                <div className="absolute inset-0 opacity-40 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-amber-500/10 via-zinc-950 to-black z-10"></div>
                                <div className="p-8 relative z-20 flex flex-col justify-between h-full">
                                    <div className="flex justify-between items-start">
                                        <div className="text-[11px] font-bold text-zinc-300 uppercase tracking-widest leading-relaxed">Plot 14-C, Zamzama<br />Phase V, Karachi</div>
                                        <span className="text-amber-500 font-black text-[10px] tracking-widest border border-amber-500/30 px-3 py-1 rounded-full uppercase">View Map</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <span className="px-4 py-1.5 bg-zinc-800 text-[9px] rounded-lg border border-zinc-700 uppercase font-black tracking-widest text-zinc-400">Directions</span>
                                        <span className="px-4 py-1.5 bg-amber-500 text-[9px] rounded-lg border border-amber-500 uppercase font-black tracking-widest text-black">Order Now</span>
                                    </div>
                                </div>
                            </div>
                            <div className="p-8 bg-amber-500/5 border border-amber-500/10 rounded-3xl group">
                                <h4 className="text-white text-xs font-black uppercase tracking-[0.2em] mb-3 group-hover:text-amber-500 transition-colors">Our Grilling Heritage</h4>
                                <p className="text-[11px] leading-relaxed text-zinc-500 font-light italic">"Our recipes are ancestral, utilizing hand-crafted clay tandoors and premium organic spices. Fire is our seasoning, and smoke is our soul."</p>
                                <div className="mt-4 flex gap-2">
                                    <div className="w-2 h-2 bg-amber-500 rounded-full animate-pulse"></div>
                                    <div className="w-2 h-2 bg-amber-500/40 rounded-full"></div>
                                    <div className="w-2 h-2 bg-amber-500/20 rounded-full"></div>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Sidebar Cart */}
                    <aside className="w-[340px] bg-[#0E1013] border-l border-zinc-800 p-8 flex flex-col h-screen sticky top-0 shrink-0 hidden xl:flex">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-xl font-serif italic text-white font-black tracking-tight">Your Platter</h2>
                            <span className="px-3 py-1 bg-zinc-800 text-[9px] rounded-full uppercase font-black text-zinc-500 border border-zinc-700">
                                {cart.length} Items
                            </span>
                        </div>

                        <div className="flex-1 space-y-6 overflow-y-auto mb-8 pr-2 scrollbar-hide">
                            {cart.length === 0 ? (
                                <div className="flex flex-col items-center justify-center h-full opacity-10 text-center gap-4">
                                     <Icon name="shopping-bag" className="w-16 h-16" />
                                     <p className="uppercase text-[10px] tracking-[0.3em] font-black">Awaiting Flavors</p>
                                </div>
                            ) : (
                                cart.map(item => (
                                    <div key={item.id} className="flex justify-between items-start border-b border-zinc-800/50 pb-5 last:border-0 group">
                                        <div className="space-y-2">
                                            <div className="text-xs font-black text-white uppercase tracking-tight group-hover:text-amber-500 transition-colors">{item.name}</div>
                                            <div className="flex items-center gap-4">
                                                <button onClick={() => updateQty(item.id, -1)} className="text-zinc-600 hover:text-white transition-colors"><Icon name="minus" className="w-3 h-3" /></button>
                                                <span className="text-[10px] text-zinc-400 font-black w-4 text-center">{item.qty}</span>
                                                <button onClick={() => updateQty(item.id, 1)} className="text-zinc-600 hover:text-white transition-colors"><Icon name="plus" className="w-3 h-3" /></button>
                                            </div>
                                        </div>
                                        <div className="text-xs font-mono text-white font-bold whitespace-nowrap">PKR {item.price * item.qty}</div>
                                    </div>
                                ))
                            )}
                        </div>

                        {cart.length > 0 && (
                            <div className="space-y-5 pt-8 border-t border-zinc-800">
                                <div className="space-y-2 text-[11px] font-black uppercase tracking-widest">
                                    <div className="flex justify-between">
                                        <span className="text-zinc-500">Subtotal</span>
                                        <span className="text-white font-mono">PKR {subtotal}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-zinc-500">Delivery</span>
                                        <span className="text-white font-mono">PKR 150</span>
                                    </div>
                                </div>
                                <div className="flex justify-between text-lg font-serif italic border-t border-zinc-800 pt-4">
                                    <span className="text-white font-black">Total</span>
                                    <span className="text-amber-500 font-extrabold">PKR {total}</span>
                                </div>
                                <button 
                                    onClick={() => setIsCheckoutOpen(true)}
                                    className="w-full py-4 bg-amber-500 text-black text-[10px] font-black uppercase tracking-[0.3em] rounded-2xl hover:scale-[1.02] active:scale-95 transition-all shadow-xl shadow-amber-500/20"
                                >
                                    Proceed to Order
                                </button>
                            </div>
                        )}
                    </aside>

                    {/* Checkout Modal */}
                    <AnimatePresence>
                        {isCheckoutOpen && (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center p-6">
                                <motion.div 
                                    initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                                    onClick={() => setIsCheckoutOpen(false)}
                                    className="absolute inset-0 bg-black/90 backdrop-blur-md"
                                />
                                <motion.div 
                                    initial={{ scale: 0.95, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 0.95, opacity: 0 }}
                                    className="relative w-full max-w-lg bg-[#121417] rounded-[3rem] border border-zinc-800 shadow-2xl overflow-hidden p-10"
                                >
                                    <h2 className="text-3xl font-serif italic text-white font-black mb-6">Confirm <span className="text-amber-500 not-italic">Order.</span></h2>
                                    <form onSubmit={handleOrder} className="space-y-4">
                                        <div className="space-y-1.5 text-[9px] font-black uppercase tracking-widest text-zinc-500">
                                            <label>Name</label>
                                            <input required type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full bg-[#0E1013] border border-zinc-800 p-4 rounded-xl text-white outline-none focus:border-amber-500/50" placeholder="John Doe" />
                                        </div>
                                        <div className="space-y-1.5 text-[9px] font-black uppercase tracking-widest text-zinc-500">
                                            <label>Phone</label>
                                            <input required type="tel" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full bg-[#0E1013] border border-zinc-800 p-4 rounded-xl text-white outline-none focus:border-amber-500/50" placeholder="03XXXXXXXXX" />
                                        </div>
                                        <div className="space-y-1.5 text-[9px] font-black uppercase tracking-widest text-zinc-500">
                                            <label>Address</label>
                                            <textarea required rows="3" value={formData.address} onChange={e => setFormData({...formData, address: e.target.value})} className="w-full bg-[#0E1013] border border-zinc-800 p-4 rounded-xl text-white outline-none resize-none focus:border-amber-500/50" placeholder="Street, Sector, House No." />
                                        </div>
                                        <div className="flex items-center gap-2 pt-2">
                                            <input type="checkbox" checked readOnly className="accent-amber-500 w-4 h-4 cursor-pointer" />
                                            <label className="text-[10px] text-zinc-500 font-bold uppercase tracking-widest">Cash on Delivery (COD)</label>
                                        </div>
                                        <button className="w-full py-5 bg-amber-500 text-black text-[10px] font-black uppercase tracking-widest rounded-2xl mt-4 shadow-xl shadow-amber-500/20 active:scale-95 transition-all">Submit Order via WhatsApp</button>
                                    </form>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    {/* Floating WhatsApp Button */}
                    <div className="fixed bottom-8 right-8 z-50">
                        <a href="https://wa.me/923001234567" target="_blank" className="w-16 h-16 bg-[#25D366] rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition-transform cursor-pointer group relative">
                            <Icon name="message-circle" className="w-8 h-8 text-white fill-white" />
                            <span className="absolute right-20 bg-[#25D366] text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none shadow-xl">Live Support</span>
                        </a>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
